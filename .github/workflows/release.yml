name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify tag matches CARD_VERSION and package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONST_VERSION=$(grep -oP "CARD_VERSION = '\K[^']+" src/const.ts)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION const=$CONST_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$CONST_VERSION" ] || [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag, CARD_VERSION and package.json version must all match"
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/area-control-card.js
          generate_release_notes: true
